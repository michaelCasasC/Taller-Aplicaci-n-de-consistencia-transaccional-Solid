services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotel_booking
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: local_demo_password
    # Publicar la base en 5433 para evitar conflictos con un PostgreSQL local en 5432.
    ports: ["5433:5432"]
    volumes:
      - hotel_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_user -d hotel_booking"]
      interval: 5s
      timeout: 5s
      retries: 15
  external-service:
    build: ./external_service
    ports: ["5001:5001"]
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://hotel_user:local_demo_password@db:5432/hotel_booking
      PAYMENT_SERVICE_URL: http://external-service:5001
      PORT: "5000"
    ports: ["5000:5000"]
    depends_on:
      db: {condition: service_healthy}
      external-service: {condition: service_started}
volumes:
  hotel_pgdata:
